<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Câu hỏi Selection Sort</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Be Vietnam Pro',sans-serif;background:#0b1020;color:#eef2ff;padding:24px;max-width:800px;margin:0 auto}.sub{color:#9aa6c2;margin-bottom:16px}.card{background:#151b2e;border-radius:16px;padding:20px}button.opt{display:flex;gap:10px;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#101628;color:#fff;font:inherit;cursor:pointer}.k{min-width:26px;font-weight:700;color:#cfc6ff}.ok{border-color:#2dd4a8;background:rgba(45,212,168,.12)}.bad{border-color:#f07178;background:rgba(240,113,120,.12)}.ex{margin-top:12px;padding:12px;border-left:4px solid #7c6cf0;background:#101628;border-radius:10px;color:#9aa6c2;display:none;line-height:1.7}.nav{margin-top:14px;display:flex;justify-content:space-between}.nav button{background:#7c6cf0;border:0;color:#fff;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}a{color:#cfc6ff}</style></head><body>
<p class="sub">WEB 3 · SELECTION SORT</p><h1>Câu hỏi trắc nghiệm</h1>
<p class="sub">Bấm A B C D. Sau khi chọn sẽ hiện đáp án và giải thích bằng tiếng Việt.</p>
<div class="card"><p id="num"></p><p id="q" style="font-size:1.15rem;line-height:1.6"></p><div id="opts"></div><div class="ex" id="ex"></div>
<div class="nav"><button type="button" id="prev">Câu trước</button><button type="button" id="next">Câu tiếp</button></div><p class="sub" id="score"></p></div>
<p class="sub"><a href="./index.html">Về bài giảng</a></p>
<script>
const Q=[
{q:"Mỗi bước Selection Sort làm gì?",a:["Chèn key vào dãy đã sắp","Tìm phần tử nhỏ nhất rồi đưa về đúng vị trí đầu","Đổi chỗ mọi cặp liền kề","Cắt mảng làm đôi"],c:1,e:"Tìm min trong đoạn chưa sắp, rồi đưa về đầu đoạn đó."},
{q:"min bằng i lúc đầu nghĩa là gì?",a:["Xóa a[i]","Tạm coi a[i] là nhỏ nhất","i là số lớn nhất","Dừng thuật toán"],c:1,e:"Bước 2: giả sử phần tử tại i đang là min, rồi vòng trong tìm min thật."},
{q:"Vòng trong j dùng để làm gì?",a:["Đổi chỗ ngay","Duyệt phần còn lại để tìm min thật","Chèn key","Tăng n"],c:1,e:"j chạy từ i+1 đến n-1. Gặp nhỏ hơn thì cập nhật min bằng j."},
{q:"Mỗi vòng ngoài đổi chỗ mấy lần?",a:["Nhiều lần","Một lần, sau khi đã tìm xong min","Không đổi bao giờ","n lần"],c:1,e:"Khác Interchange: Selection chỉ đổi chỗ một lần mỗi vòng."},
{q:"Số lần đổi chỗ tối đa?",a:["n nhân n","n trừ 1","1","n chia 2"],c:1,e:"Có n-1 vòng ngoài, mỗi vòng đổi tối đa một lần."},
{q:"Độ phức tạp Selection Sort?",a:["O(n) khi gần sắp","Luôn O(n bình phương)","O(n log n)","O(1)"],c:1,e:"Luôn O(n bình phương), kể cả khi dữ liệu gần sắp. Không dừng sớm."},
{q:"Selection Sort có ổn định không?",a:["Có","Không ổn định","Chỉ khi dùng temp","Chỉ khi n nhỏ hơn 50"],c:1,e:"Không ổn định. Không phù hợp nếu cần giữ thứ tự bằng nhau."},
{q:"Nên dùng khi nào?",a:["Dữ liệu lớn trên mười nghìn phần tử","Mảng nhỏ, chi phí đổi chỗ cao, giảng dạy cơ bản","Cần dừng sớm","Cần ổn định"],c:1,e:"Phù hợp n nhỏ hơn 50 hoặc khi đổi chỗ rất tốn."}
];
let i=0,picked=Array(Q.length).fill(null),score=0;
function render(){const t=Q[i]; document.getElementById('num').textContent='Câu '+(i+1)+' / '+Q.length; document.getElementById('q').textContent=t.q; const box=document.getElementById('opts'); box.innerHTML=''; const L=['A','B','C','D']; t.a.forEach(function(txt,k){const b=document.createElement('button'); b.className='opt'; b.type='button'; b.innerHTML='<span class="k">'+L[k]+'</span><span>'+txt+'</span>'; if(picked[i]!==null){b.disabled=true; if(k===t.c)b.classList.add('ok'); if(k===picked[i]&&k!==t.c)b.classList.add('bad');} else b.onclick=function(){if(picked[i]!==null)return; picked[i]=k; if(k===t.c)score++; render();}; box.appendChild(b);}); const ex=document.getElementById('ex'); if(picked[i]!==null){ex.style.display='block'; ex.innerHTML='<b style="color:#fff">'+(picked[i]===t.c?'Đúng. ':'Sai. ')+'Đáp án: '+L[t.c]+'</b><br>'+t.e;} else {ex.style.display='none';} document.getElementById('prev').disabled=i===0; document.getElementById('next').textContent=i===Q.length-1?'Xem điểm':'Câu tiếp'; const done=picked.filter(function(x){return x!==null;}).length; document.getElementById('score').textContent=done?('Đã trả lời '+done+'/'+Q.length+' · Đúng '+score+' câu'):'Chưa chọn đáp án';}
document.getElementById('prev').onclick=function(){if(i>0){i--;render();}};
document.getElementById('next').onclick=function(){if(i<Q.length-1){i++;render();}else{document.getElementById('q').textContent='Bạn đúng '+score+' / '+Q.length+' câu.'; document.getElementById('opts').innerHTML=''; document.getElementById('ex').style.display='block'; document.getElementById('ex').textContent='Hết bài Selection Sort.';}};
render();
</script></body></html>
